[package]
name = "glide-phone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
futures-util = "0.3"
glide-config.workspace = true
glide-desktop.workspace = true
glide-paint.workspace = true
glide-sdk.workspace = true
glide-theme.workspace = true
libc = "0.2"
rcgen = "0.13"
ring = "0.17"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "process", "signal", "fs"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["codec"] }
tracing.workspace = true
tracing-subscriber = { workspace = true }
zbus.workspace = true

[dev-dependencies]
glide-app = { workspace = true, features = ["test-bus"] }

[lints]
workspace = true
